# Paths are relative to the repository root.
paths:
  raw: data/raw
  master_chunks: data/interim/master_dataset_parquet
  preprocessed_chunks: data/interim/preprocessed_chunks
  feature_chunks: data/processed/feature_chunks
  models: models
  tables: reports/tables

ingestion:
  chunk_size: 3000          # item-rows melted per chunk -> 11 chunks of 5,739,000 rows

split:                      # time-based split used in notebook 06
  valid_start: "2016-02-29"
  test_start: "2016-03-28"  # last 28 days of the data (2016-03-28 .. 2016-04-24); not used for scoring
  n_chunks: 4               # notebook 06 loads the first 4 feature chunks

model:
  target: sales
  baseline_params:          # notebook 06 baseline (LightGBM)
    objective: regression
    metric: rmse
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 64
    max_depth: -1
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
    verbose: -1
